<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <!-- pink → blue border, same as the game board -->
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2e97"/>
      <stop offset="1" stop-color="#29d3ff"/>
    </linearGradient>
    <!-- soft neon glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- dark tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#07051a" stroke="url(#edge)" stroke-width="3"/>

  <!-- faint grid lines -->
  <g stroke="#29d3ff" stroke-opacity="0.25" stroke-width="1.5">
    <line x1="32" y1="10" x2="32" y2="54"/>
    <line x1="10" y1="32" x2="54" y2="32"/>
  </g>

  <!-- pink X (top left) and blue O (bottom right) -->
  <g filter="url(#glow)" stroke-linecap="round" stroke-width="5" fill="none">
    <path d="M13 13 L27 27 M27 13 L13 27" stroke="#ff2e97"/>
    <circle cx="44" cy="44" r="8" stroke="#29d3ff"/>
  </g>
</svg>
